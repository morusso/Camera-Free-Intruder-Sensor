# MQTT -> InfluxDB. Three message types, three measurements. Time = arrival time: the device clock can be unsynced.
[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  name_override = "sensor_event"
  servers = ["${MQTT_BROKER}"]
  topics = ["sensors/+/event"]
  qos = 1
  persistent_session = true
  client_id = "telegraf-events"
  tls_ca = "/certs/ca.pem"
  tls_cert = "/certs/client.crt"
  tls_key = "/certs/client.key"
  data_format = "json"
  tag_keys = ["device", "link", "event", "class"]
  json_string_fields = []

[[inputs.mqtt_consumer]]
  name_override = "sensor_metrics"
  servers = ["${MQTT_BROKER}"]
  topics = ["sensors/+/metrics"]
  qos = 0
  client_id = "telegraf-metrics"
  tls_ca = "/certs/ca.pem"
  tls_cert = "/certs/client.crt"
  tls_key = "/certs/client.key"
  data_format = "json"
  tag_keys = ["device", "link"]

[[inputs.mqtt_consumer]]
  name_override = "sensor_status"
  servers = ["${MQTT_BROKER}"]
  topics = ["sensors/+/status"]
  qos = 1
  client_id = "telegraf-status"
  tls_ca = "/certs/ca.pem"
  tls_cert = "/certs/client.crt"
  tls_key = "/certs/client.key"
  data_format = "json"
  tag_keys = ["device", "link", "state"]
  json_string_fields = []

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
